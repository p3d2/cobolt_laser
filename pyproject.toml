[project]
name = "cobolt"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "jupyterlab>=4.6.5",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "psutil>=7.2.2",
    "pycobolt",
    "pyserial>=3.5",
    "tqdm>=4.70.1",
]

[tool.uv.sources]
pycobolt = { git = "https://github.com/cobolt-lasers/pycobolt.git" }
